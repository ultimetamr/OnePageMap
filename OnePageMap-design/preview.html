<!doctype html>
<!-- scope:web_design_validation_only source-interaction-revision:8 source-visual-revision:3 source-design-system-review-revision:7 preview-revision:5 -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OnePageMap 设计验证</title><style>
:root{--accent:#f2b84b;--paper:#f5e9d2;--brand:#315b4c;--ink:#20312b;--risk:#c8443a;--ground:#203029}*{box-sizing:border-box}body{margin:0;background:#111a16;color:#fff;font:16px/1.45 system-ui}.app{width:min(1600px,98vw);margin:1vh auto;min-height:96vh;padding:24px;border:1px solid #587064;border-radius:32px;background:var(--ground)}button,select,input{min-height:56px;border:0;border-radius:14px;padding:0 14px;font:inherit}button{background:var(--brand);color:#fff}.bar{height:64px;display:flex;gap:8px;align-items:center;overflow:auto}.bar h1{font-size:22px;margin-right:auto;white-space:nowrap}.body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;height:772px;margin-top:16px}.canvas{position:relative;overflow:auto;border-radius:32px;background:linear-gradient(#294036,#192620)}.rail{overflow:auto;border-radius:32px;padding:20px;background:#f5e9d2ed;color:var(--ink)}.flag{position:absolute;right:60px;top:35px;color:var(--accent);font-size:30px}.step{position:absolute;width:190px;min-height:128px;padding:14px;border:2px solid #8a8175;border-radius:20px;background:var(--paper);color:var(--ink)}.step strong{display:block;transform:var(--text-rotate,rotate(0))}.handles{display:flex;gap:4px}.handles button{min-width:56px;padding:0}.risk{position:absolute;left:540px;top:480px;padding:16px;border-radius:34% 45%;background:var(--risk);font-weight:700}.toolbox{position:absolute;bottom:16px;left:24px;padding:12px;border-radius:16px;background:#6d4c30}.curve{position:absolute;inset:0;pointer-events:none}.toast{position:absolute;left:40%;top:12px;padding:12px;background:#000b;border-radius:12px}.hidden{display:none!important}.error{color:#9f201a}.lab{margin-top:12px;padding-top:12px;border-top:1px solid #998}.lab label{display:block;margin:6px 0}.lab-output{padding:8px;border-radius:10px;background:#fff;color:#20312b}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#000a}.dialog{width:min(640px,90vw);padding:28px;border-radius:32px;background:var(--paper);color:var(--ink)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.focused{outline:4px solid var(--accent)}.selected{box-shadow:0 0 0 4px #fff}.dragging{opacity:.7}.connecting,.acquiring{border-style:dashed}.disabled{opacity:.45}.loading{animation:pulse 1s infinite}.empty{filter:grayscale(1)}.error-state{outline:4px solid var(--risk)}.overflow{overflow:auto}.compact .body{grid-template-columns:1fr;grid-template-rows:336px 420px}.compact .rail{border-radius:24px}.constrained .body{grid-template-columns:1fr;grid-template-rows:576px 180px}.constrained .rail{display:flex;gap:6px;align-items:center;border-radius:20px;overflow:auto}.constrained .rail>.lab,.constrained .rail>p,.constrained .rail>label{display:none}.constrained .canvas{overflow:auto}[data-reduce-motion=true] *{animation:none!important;transition:none!important;transform:none!important}@keyframes pulse{50%{opacity:.45}}
</style></head><body><main id="app" class="app" data-state="S3" data-responsive="Large" data-reduce-motion="false"><header class="bar"><h1>OnePageMap · 筹备读书会</h1><button data-action="x1">选模板</button><button data-action="x3">保存</button><button data-action="x5">导出</button><button id="backButton">返回</button></header><section class="body"><div id="canvas" class="canvas" data-preview-id="canvas_steps" data-binding="steps"><div id="sceneContent" class="hidden"></div><svg class="curve" data-preview-id="canvas_edges" data-binding="connections"><path data-preview-id="edge_path" data-binding="edge.positions" d="M280 270 C380 210 440 340 540 290" fill="none" stroke="#d8c49f" stroke-width="5"/><path data-preview-id="edge_arrow" data-binding="edge.endpoints" d="M535 282l16 8-16 8z" fill="#d8c49f"/></svg><div class="flag" data-preview-id="canvas_goal" data-binding="goal">⚑ 筹备读书会</div><div id="steps"></div><div id="risk" class="risk" data-preview-id="canvas_risks" data-binding="risks"><span data-preview-id="risk_shape" data-binding="risk.severity">▲</span> <span data-preview-id="risk_title" data-binding="risk.title">场地临时变更</span><small data-preview-id="risk_near" data-binding="risk.nearStepId">靠近：确认场地</small><button data-preview-id="risk_delete" data-binding="risk.id">删除</button></div><div class="toolbox" data-preview-id="canvas_toolbox" data-binding="resources">🧰 场地联系人 · 报名表 · 讨论提纲</div><div data-preview-id="edge_error" data-binding="edge.validation" class="toast hidden">连线已存在</div></div><aside id="panel" class="rail" data-preview-id="panel_body" data-binding="panel.body"><div data-preview-id="panel_title" data-binding="panel.title"><b id="panelTitle">搭小路</b></div><p data-preview-id="panel_error" data-binding="panel.validation" id="panelError" class="error hidden">请填写有效内容</p><button data-preview-id="panel_cancel" data-action="x15">取消草稿</button><button data-preview-id="panel_primary" data-binding="panel.primaryEnabled" data-action="x10">保存更改</button><div id="commandMenu"><button data-action="x2">确认目标</button><button data-action="x4">恢复</button><button data-action="x6">确认导出</button><button data-action="x7">删除路标</button><button data-action="x9">新建步骤</button><button data-action="x11">移动/旋转</button><button data-action="x12">新建/重复连线</button><button data-action="x13">风险</button><button data-action="x14">资源</button></div><section class="lab"><label>顶层场景<select id="sceneSelect"></select></label><label>响应档<select id="tierSelect"><option>Large</option><option>Compact</option><option>Constrained</option></select></label><button id="motionToggle">减少动效</button><label>组件状态<select id="statePairSelect"></select></label><label>堆叠规则<select id="precedenceSelect"></select></label><label>组件变体<select id="variantSelect"></select></label><label>数据绑定<select id="bindingSelect"></select></label><label>样例<select id="bindingMode"><option>normal</option><option>fallback</option><option>error</option></select></label><div id="labOutput" class="lab-output">验证结果</div></section></aside></section></main><div id="dialog" class="modal hidden" data-state="D1"><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogBody"></p><div class="dialog-actions"><button id="dialogCancel">取消</button><button id="dialogConfirm">确认</button></div></div></div><script>
const $=s=>document.querySelector(s),app=$('#app'),canvas=$('#canvas'),panel=$('#panel'),risk=$('#risk'),steps=$('#steps'),out=$('#labOutput');const sample=['确定主题','选定书目','确认场地','发布报名','准备引导问题','举办读书会'];let stepData=[...sample],dirty=true,pending=null,edgeMode='normal';
function drawSteps(mode='normal'){steps.innerHTML='';let data=mode==='fallback'?['未命名步骤']:mode==='error'?['步骤数据无法读取']:stepData;data.forEach((n,i)=>{let e=document.createElement('article');e.className='step';e.style.left=(55+i%3*230)+'px';e.style.top=(135+Math.floor(i/3)*185)+'px';let canon=i===0;e.innerHTML=`<span ${canon?'data-preview-id="step_status"':''} data-instance-field="step_status" data-binding="steps.status">○ ${i<2?'完成':i<4?'进行中':'未开始'}</span><strong ${canon?'data-preview-id="step_title"':''} data-instance-field="step_title" data-binding="steps.title">${n}</strong><div class="handles"><button ${canon?'data-preview-id="step_connector"':''} data-instance-field="step_connector" data-binding="steps.id">⤴</button><button ${canon?'data-preview-id="step_rotate"':''} data-instance-field="step_rotate" data-binding="steps.rotation">↻</button><button ${canon?'data-preview-id="step_delete"':''} data-instance-field="step_delete">×</button></div>`;steps.append(e)})}drawSteps();
const scenes={S1:'选起点：空白、活动筹备、学习计划、产品上线',S2:'立目标：输入不可为空',S3:'搭小路',S4:'保存架：0/10',S5:'导出取景：1600×900',D1:'删除路标？'};const sceneMarkup={S1:'<h2>选一个起点</h2><button>空白</button> <button>活动筹备</button> <button>学习计划</button> <button>产品上线</button>',S2:'<h2>立目标</h2><input id="goalInput" placeholder="例：筹备读书会"><p>空目标会留在本页并显示错误。</p>',S4:'<h2>保存架 0/10</h2><button>新建保存</button><p>暂无保存。恢复前会检查未保存更改。</p>',S5:'<h2>导出预览 1600×900</h2><div style="border:4px solid #f2b84b;padding:24px"><b>⚑ 筹备读书会</b><p>六步路线 · 两条连线 · 一个风险</p><p>文字可读，操作把手已隐藏。</p></div>'};Object.keys(scenes).forEach(s=>sceneSelect.add(new Option(s+' '+scenes[s],s)));function renderScene(s){app.dataset.state=s;panelTitle.textContent=scenes[s];let overlay=['S1','S2','S4','S5'].includes(s);sceneContent.classList.toggle('hidden',!overlay);sceneContent.innerHTML=overlay?sceneMarkup[s]:'';[...canvas.children].forEach(x=>{if(x!==sceneContent)x.classList.toggle('hidden',overlay)});app.dataset.variant=s==='S5'?'export':'editor';if(s==='D1')openDialog('删除路标？','将同时删除 1 条连线。','delete')}sceneSelect.onchange=()=>renderScene(sceneSelect.value);
function openDialog(t,b,mode){dialogTitle.textContent=t;dialogBody.textContent=b;pending=mode;dialog.classList.remove('hidden')}dialogCancel.onclick=()=>{dialog.classList.add('hidden');pending=null;renderScene('S3')};dialogConfirm.onclick=()=>{dialog.classList.add('hidden');let done=pending;if(done==='delete'){steps.firstElementChild?.remove();document.querySelector('[data-preview-id=edge_path]').classList.add('hidden');out.textContent='已原子删除路标和连线'}if(done==='restore'){stepData=[...sample];drawSteps();dirty=false;out.textContent='已恢复保存'}if(done==='export')out.textContent='已确认固定构图导出';if(done==='exit'){dirty=false;out.textContent='已放弃更改并退出';pending=null;return renderScene('S1')}pending=null;renderScene('S3')};
let draftBefore=null;function action(id){if(id==='x1')return renderScene('S2');if(id==='x2'){let v=$('#goalInput')?.value?.trim()||'';let valid=!!v;panelError.classList.toggle('hidden',valid);if(!valid){out.textContent='目标不能为空';return renderScene('S2')}document.querySelector('[data-preview-id=canvas_goal]').textContent='⚑ '+v;return renderScene('S3')}if(id==='x3')return renderScene('S4');if(id==='x4')return dirty?openDialog('恢复保存？','当前有未保存更改。','restore'):(stepData=[...sample],drawSteps());if(id==='x5')return renderScene('S5');if(id==='x6')return openDialog('导出固定截图？','确认 1600×900 取景中文字可读。','export');if(id==='x7')return renderScene('D1');if(id==='x9'){if(stepData.length>=12)return out.textContent='最多 12 张步骤卡';stepData.push('新步骤');drawSteps();dirty=true;return out.textContent='已添加步骤'}if(id==='x10'){draftBefore=stepData[0];stepData[0]='确定活动主题';drawSteps();dirty=true;return out.textContent='标题/状态已更新（可取消草稿）'}if(id==='x11'){let s=steps.firstElementChild;s.style.left='130px';s.style.transform='rotate(8deg)';s.style.setProperty('--text-rotate','rotate(-8deg)');document.querySelector('[data-preview-id=edge_path]').setAttribute('d','M340 270 C400 220 470 340 570 290');dirty=true;return out.textContent='卡片移动，曲线连续，文字正向'}if(id==='x12'){if(edgeMode==='normal'){edgeMode='duplicate';return out.textContent='已创建连线'}document.querySelector('[data-preview-id=edge_error]').classList.remove('hidden');return out.textContent='重复/自连线已拒绝'}if(id==='x13'){risk.style.left='620px';risk.querySelector('[data-preview-id=risk_title]').textContent='场地变更';risk.querySelector('[data-preview-id=risk_near]').textContent='靠近：确认场地';return out.textContent='风险已创建/编辑/移动'}if(id==='x14'){document.querySelector('[data-preview-id=canvas_toolbox]').textContent='🧰 联系人 · 报名表 · 讨论提纲 · 签到表';return out.textContent='资源已更新'}if(id==='x15'){if(draftBefore!==null){stepData[0]=draftBefore;draftBefore=null;drawSteps()}return out.textContent='草稿已取消，原值已恢复'}}document.addEventListener('click',e=>{if(e.target.dataset.action)action(e.target.dataset.action)});backButton.onclick=()=>dirty?openDialog('放弃未保存更改？','取消返回编辑；确认退出到模板。','exit'):renderScene('S1');
const pairs={RouteCanvas:['default','focused','selected','disabled','loading','empty','error','overflow'],StepSign:['default','focused','selected','dragging','connecting','disabled','loading','empty','error','overflow'],ConnectionCurve:['default','focused','selected','acquiring','duplicate_error','disabled','loading','empty','error','overflow'],RiskStone:['default','focused','selected','dragging','disabled','loading','empty','error','overflow'],ActionPanel:['default','focused','selected','disabled','loading','empty','error','overflow']};Object.entries(pairs).forEach(([c,ss])=>ss.forEach(s=>statePairSelect.add(new Option(c+'.'+s,c+'|'+s))));const precedences=['StepSign:error>disabled>dragging>selected>focused','Canvas:error>loading>disabled>selected>focused','Curve:error>disabled>selected>focused','Risk:error>disabled>dragging>selected>focused','Panel:error>loading>disabled>focused'];precedences.forEach(x=>precedenceSelect.add(new Option(x,x)));function target(c){return c==='RouteCanvas'?canvas:c==='StepSign'?steps.firstElementChild:c==='ConnectionCurve'?document.querySelector('[data-preview-id=edge_path]'):c==='RiskStone'?risk:panel}statePairSelect.onchange=()=>{let[c,s]=statePairSelect.value.split('|'),t=target(c);t.className=t.className.replace(/focused|selected|dragging|connecting|acquiring|disabled|loading|empty|error-state|overflow/g,'');t.classList.add(s==='error'||s==='duplicate_error'?'error-state':s);t.dataset.componentState=s;out.textContent=c+' '+s+'：独立可观察'};precedenceSelect.onchange=()=>{let[c,rule]=precedenceSelect.value.split(':'),dominant=rule.split('>')[0];out.textContent='堆叠 '+rule+'；当前主导='+dominant;target(c==='Canvas'?'RouteCanvas':c==='Curve'?'ConnectionCurve':c==='Risk'?'RiskStone':c==='Panel'?'ActionPanel':c).dataset.precedence=rule};
const variants={RouteCanvas:['editor','export'],StepSign:['regular','compact','export'],ConnectionCurve:['normal','overlap-offset','export'],RiskStone:['linked','unlinked','export'],ActionPanel:['template','goal','step','risk','resource','save','export','delete','dirty-restore']};Object.entries(variants).forEach(([c,vs])=>vs.forEach(v=>variantSelect.add(new Option(c+'.'+v,c+'|'+v))));variantSelect.onchange=()=>{let[c,v]=variantSelect.value.split('|'),t=target(c);t.dataset.variant=v;if(c==='RouteCanvas'||c==='StepSign'||c==='RiskStone')document.querySelectorAll('.handles,[data-preview-id=risk_delete]').forEach(x=>x.classList.toggle('hidden',v==='export'));if(c==='ConnectionCurve')document.querySelector('[data-preview-id=edge_path]').setAttribute('stroke-width',v==='export'?'5':v==='overlap-offset'?'7':'4');if(c==='RiskStone')risk.querySelector('[data-preview-id=risk_near]').textContent=v==='unlinked'?'未关联':'靠近：确认场地';if(c==='ActionPanel')panelTitle.textContent='面板变体：'+v;out.textContent=c+'.'+v+'已呈现'};
const binds=['goal','steps','connections','risks','resources','steps.status','steps.title','steps.id','steps.rotation','edge.endpoints','edge.positions','edge.validation','risk.title','risk.nearStepId','risk.severity','risk.id','panel.title','panel.body','panel.validation','panel.primaryEnabled','saves'];binds.forEach(b=>bindingSelect.add(new Option(b,b)));function bindingDemo(){let b=bindingSelect.value,m=bindingMode.value,normal={'goal':'筹备读书会','steps':'6 张步骤','connections':'2 条连线','risks':'1 个风险','resources':'4 项资源','steps.status':'□ 完成','steps.title':'确定主题','steps.id':'step-1','steps.rotation':'8°（文字正向）','edge.endpoints':'step-1→step-2','edge.positions':'贝塞尔曲线已更新','edge.validation':'有效','risk.title':'场地变更','risk.nearStepId':'确认场地','risk.severity':'▲ 风险','risk.id':'risk-1','panel.title':'步骤编辑','panel.body':'表单已加载','panel.validation':'有效','panel.primaryEnabled':'可用','saves':'筹备读书会 · 8月12日 18:30'}[b];let v=m==='normal'?normal:m==='fallback'?({'goal':'先写下目标','steps':'新建第一个路标','connections':'已隐藏','risks':'已隐藏','resources':'还没有资源','steps.status':'○ 未开始','steps.title':'未命名步骤','steps.id':'操作已禁用','steps.rotation':'0°','edge.endpoints':'端点缺失，曲线隐藏','edge.positions':'使用最后有效位置','edge.validation':'隐藏','risk.title':'未命名风险','risk.nearStepId':'未关联','risk.severity':'▲ 风险','risk.id':'删除已禁用','panel.title':'编辑','panel.body':'请选择对象','panel.validation':'隐藏','panel.primaryEnabled':'不可用','saves':'暂无保存'}[b]):'错误：'+b+'无法读取';out.textContent=b+' / '+m+' → '+v;out.dataset.binding=b;out.dataset.mode=m}bindingSelect.onchange=bindingDemo;bindingMode.onchange=bindingDemo;
tierSelect.onchange=()=>{app.classList.remove('compact','constrained');app.dataset.responsive=tierSelect.value;if(tierSelect.value!=='Large')app.classList.add(tierSelect.value.toLowerCase());out.textContent=tierSelect.value==='Large'?'右侧编辑栏':tierSelect.value==='Compact'?'420dp 底部 Sheet':'180dp 有标签命令菜单 + 滚动画布'};motionToggle.onclick=()=>{app.dataset.reduceMotion=app.dataset.reduceMotion==='false'?'true':'false';out.textContent='减少动效='+app.dataset.reduceMotion+'；位移/缩放已移除'};renderScene('S3');bindingDemo();
</script></body></html>
